events {}

http {
    upstream web-server {
        server web-server:80;
        server web-server2:80;
    }

    server {
        listen 80;

        # web-server
        location / {
            proxy_pass http://web-server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # app-server
        location /api/ {
            proxy_pass http://app-server:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /student/ {
            proxy_pass http://app-server:8081/student;
        }
    
        # auth-server
        location /auth/ {
            return 302 http://localhost:8081/realms/master/protocol/openid-connect/auth?client_id=security-admin-console&redirect_uri=http%3A%2F%2Flocalhost%3A8081%2Fadmin%2Fmaster%2Fconsole%2F&state=4ffa4b72-db5f-4171-8800-221e964a3856&response_mode=query&response_type=code&scope=openid&nonce=d83015eb-0e41-43ae-95f2-4b8894dbce2d&code_challenge=BjSmx73wJKjAgRYWMLZXgbuRXVntdfX-Xm3-YzdmUgE&code_challenge_method=S256;
        }
    }
}