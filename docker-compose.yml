services:
  web-server:
    build: ./web-server
    image: pttbinh/web:dev
    container_name: web-server
    ports: ["8080:80"]
    networks: [cloud-net]
    restart: unless-stopped

  web-server2:
    build: ./web-server-2
    container_name: web-server2
    networks: [cloud-net]
    restart: unless-stopped

  app-server:
    build: ./app-server
    image: pttbinh/app:dev
    container_name: app-server
    networks: [cloud-net]
    ports: ["8085:8081"]
    restart: unless-stopped

  database-server:
    image: mariadb:11
    container_name: database-server
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./database-server/init:/docker-entrypoint-initdb.d:ro
    ports: ["3306:3306"]
    networks: [cloud-net]
    restart: unless-stopped

  auth-server:
    image: quay.io/keycloak/keycloak:latest
    container_name: auth-server
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports: ["8081:8080"]
    networks: [cloud-net]
    restart: unless-stopped

  storage-server:
    image: minio/minio
    container_name: storage-server
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./storage-server/data:/data
    ports: ["9000:9000", "9001:9001"]
    networks: [cloud-net]
    restart: unless-stopped

  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    ports: ["9100:9100"]
    networks: [cloud-net]
    restart: unless-stopped

  monitoring-prometheus-server:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus-server
    depends_on:
      - monitoring-node-exporter-server
      - web-server
    ports: ["9090:9090"]
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [cloud-net]
    restart: unless-stopped

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    ports: ["3000:3000"]
    networks: [cloud-net]

  proxy:
    image: nginx:1.27-alpine
    container_name: proxy
    depends_on:
      - web-server
      - app-server
      - auth-server
    ports: ["80:80"]
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [cloud-net]
    restart: unless-stopped

  dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: dns-server
    ports: ["1053:53/udp"]
    volumes:
      - ./dns-server/named.conf.options:/etc/bind/named.conf.options:ro
      - ./dns-server/named.conf.local:/etc/bind/named.conf.local:ro
      - ./dns-server/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks: [cloud-net]
    restart: unless-stopped

networks:
  cloud-net: {}
